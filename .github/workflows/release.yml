name: release

# Releases straight from main, with no release PR and nothing committed back: semantic-release reads the commit
# messages since the last tag, and when one is a fix, feat or breaking change it publishes the next version to npm
# (trusted publishing over OIDC, with provenance), makes the GitHub release with the Claude Desktop bundle attached,
# and publishes server.json to the MCP Registry. The daily schedule picks up Dependabot fixes that automerge.yml
# merged (a merge made with the workflow token starts no push run). Kuma's "filester-mcp release" monitor reads
# this workflow's newest run.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # semantic-release 26 requires Node >=26.13 (its engines field); its plugins accept 26.
          node-version: 26
      - name: wait for the hand-published first version
        id: gate
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            echo "::notice::no v* tag yet: the first version is published by hand (docs/RELEASING.md), so nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        run: npm ci
      - if: steps.gate.outputs.skip != 'true'
        run: npm run build
      - if: steps.gate.outputs.skip != 'true'
        run: npm test
      - if: steps.gate.outputs.skip != 'true'
        run: npm ci --prefix packaging/mcpb --no-audit --no-fund
      - name: semantic-release
        if: steps.gate.outputs.skip != 'true'
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
